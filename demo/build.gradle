plugins {
  id 'java'
  id 'application'
}

mainClassName = 'ch.micheljung.fxborderlessscene.Main'

project.ext.javaFxPlatform = rootProject.ext.javaFxPlatform

dependencies {
  implementation project(':')
  implementation 'io.github.micheljung:jfx-waitomo-theme:0.3.0'

  implementation "org.openjfx:javafx-base:${demoJavaFxVersion}:${javaFxPlatform}"
  implementation "org.openjfx:javafx-controls:${demoJavaFxVersion}:${javaFxPlatform}"
  implementation "org.openjfx:javafx-fxml:${demoJavaFxVersion}:${javaFxPlatform}"
  implementation "org.openjfx:javafx-graphics:${demoJavaFxVersion}:${javaFxPlatform}"
  implementation "org.openjfx:javafx-media:${demoJavaFxVersion}:${javaFxPlatform}"
  implementation "org.openjfx:javafx-web:${demoJavaFxVersion}:${javaFxPlatform}"
}
